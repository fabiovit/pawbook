name: Finalize PawBook 6.5

on:
  push:
    branches:
      - pawbook-650-final
    paths:
      - scripts/finalize_pawbook650.py
      - .github/workflows/finalize-pawbook-650.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pawbook-650-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch panel loader
        run: python scripts/finalize_pawbook650.py
      - name: Check Python
        run: python -m py_compile custom_components/pawbook/panel.py
      - name: Check JavaScript
        run: |
          node --check custom_components/pawbook/frontend/pawbook-panel-v640.js
          node --check custom_components/pawbook/frontend/pawbook-panel-v650.js
      - name: Commit final loader and clean temporary build files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/finalize_pawbook650.py .github/workflows/finalize-pawbook-650.yml
          git add -A
          git commit -m "PawBook v6.5.0 - load v650 frontend" || exit 0
          git push origin pawbook-650-final
