name: PawBook 6.5.2 Gestione Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pawbook-652-gestione-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Gestione menu
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('custom_components/pawbook/frontend/pawbook-panel-v650.js')
          s = p.read_text(encoding='utf-8')

          old = '''          <details class="nav-more">\n            <summary><ha-icon icon="mdi:view-grid-plus-outline"></ha-icon><span>Gestione</span><ha-icon icon="mdi:chevron-down"></ha-icon></summary>\n            <div class="nav-more-menu">'''
          new = '''          <div class="nav-more">\n            <button type="button" class="nav-more-toggle" aria-expanded="false"><ha-icon icon="mdi:view-grid-plus-outline"></ha-icon><span>Gestione</span><ha-icon class="nav-chevron" icon="mdi:chevron-down"></ha-icon></button>\n            <div class="nav-more-menu" hidden>'''
          if old not in s:
              raise SystemExit('Gestione opening block not found')
          s = s.replace(old, new, 1)
          s = s.replace('''            </div>\n          </details>`;''', '''            </div>\n          </div>`;''', 1)

          marker = '''        nav.querySelectorAll("[data-nav-target]").forEach((button) => {'''
          inject = '''        const wrapper = nav.querySelector(".nav-more");\n        const toggle = nav.querySelector(".nav-more-toggle");\n        const menu = nav.querySelector(".nav-more-menu");\n        const setOpen = (open) => {\n          if (!wrapper || !toggle || !menu) return;\n          toggle.setAttribute("aria-expanded", open ? "true" : "false");\n          menu.hidden = !open;\n          wrapper.classList.toggle("open", open);\n        };\n        toggle?.addEventListener("click", (ev) => {\n          ev.preventDefault();\n          ev.stopPropagation();\n          setOpen(toggle.getAttribute("aria-expanded") !== "true");\n        });\n\n'''
          if marker not in s:
              raise SystemExit('navigation listener marker not found')
          s = s.replace(marker, inject + marker, 1)
          s = s.replace('''            const details = button.closest("details");\n            if (details) details.open = false;''', '''            setOpen(false);''', 1)

          s = s.replace('.primary-nav>button,.nav-more>summary{', '.primary-nav>button,.nav-more-toggle{')
          s = s.replace('.primary-nav>button.active,.nav-more.contains-active>summary,.nav-more[open]>summary{', '.primary-nav>button.active,.nav-more-toggle.contains-active,.nav-more.open>.nav-more-toggle{')
          s = s.replace('.nav-more{position:relative;margin-left:auto}.nav-more>summary::-webkit-details-marker{display:none}', '.nav-more{position:relative;margin-left:auto}.nav-more.open .nav-chevron{transform:rotate(180deg)}.nav-chevron{transition:transform .18s ease}')
          s = s.replace('.nav-more-menu{position:absolute;', '.nav-more-menu[hidden]{display:none!important}.nav-more-menu{position:absolute;')
          s = s.replace('.primary-nav>button,.nav-more>summary{min-height:40px!important;', '.primary-nav>button,.nav-more-toggle{min-height:40px!important;')
          s = s.replace('PawBook 6.5.1 frontend error', 'PawBook 6.5.2 frontend error')
          p.write_text(s, encoding='utf-8')

          m = Path('custom_components/pawbook/manifest.json')
          data = json.loads(m.read_text(encoding='utf-8'))
          data['version'] = '6.5.2'
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('RELEASE-6.5.2.md').write_text('''# PawBook v6.5.2 – Gestione Menu Hotfix\n\nPawBook 6.5.2 fixes the Gestione navigation menu in Safari and the Home Assistant panel context.\n\n## Fixed\n\n- Replaced the native details/summary control with an explicit JavaScript-driven menu button.\n- Fixed cases where Gestione did not open.\n- Added reliable open/close behavior on desktop and mobile.\n- Management items close the menu and open the selected PawBook section.\n\n## Preserved\n\nAll PawBook Health OS, Smart Health, Agenda, ENCI, Multi-Pet, genealogy, documents, reports and backup features remain unchanged.\n\n## Support PawBook\n\nhttps://ko-fi.com/fabvittori\n''', encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "fabvittori"
          git config user.email "63154975+fabiovit@users.noreply.github.com"
          git add custom_components/pawbook/frontend/pawbook-panel-v650.js custom_components/pawbook/manifest.json RELEASE-6.5.2.md
          git commit -m "PawBook v6.5.2 - fix Gestione menu" || exit 0
          git push
