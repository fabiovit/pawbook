name: Package PawBook 6.6.1 Test ZIP

on:
  push:
    branches: [pawbook-661-standalone-test]
    paths:
      - '.github/workflows/package-661-test.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          rm -rf custom_components/pawbook/__pycache__
          cd custom_components
          zip -r ../pawbook-v6.6.1-standalone-test.zip pawbook -x 'pawbook/__pycache__/*'
      - uses: actions/upload-artifact@v4
        with:
          name: pawbook-v6.6.1-standalone-test
          path: pawbook-v6.6.1-standalone-test.zip
