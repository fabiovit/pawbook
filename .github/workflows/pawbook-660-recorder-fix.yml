name: PawBook 6.6.0 Recorder Fix

on:
  push:
    paths:
      - '.github/workflows/pawbook-660-recorder-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Recorder attribute fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          sensor = Path('custom_components/pawbook/sensor.py')
          text = sensor.read_text()
          text = text.replace('            "foto": profile.get("photo_url"),\n', '')
          text = text.replace('            "albero": tree,\n', '')
          sensor.write_text(text)

          manifest = Path('custom_components/pawbook/manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = '6.6.0'
          manifest.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          release = Path('RELEASE-6.6.0.md')
          release.write_text('''# PawBook v6.6.0 – Recorder Optimization\n\nPawBook 6.6.0 reduces oversized Home Assistant sensor attributes to keep Recorder healthy and avoid the 16 KB state-attribute limit.\n\n## Recorder optimization\n\n- Removed the pet photo payload from `sensor.*_stato_sanitario` attributes.\n- Removed the complete genealogy tree from `sensor.*_genealogia` attributes.\n- Kept compact, useful summary attributes such as pet identity, ENCI references, parent names and total ancestor count.\n- Full photos and genealogy data remain available inside PawBook itself.\n\nThis prevents warnings such as `State attributes ... exceed maximum size of 16384 bytes` and avoids unnecessary database growth.\n\n## Data safety\n\nNo PawBook records are deleted. This release only stops duplicating large payloads into Home Assistant entity state attributes.\n\n## Support PawBook\n\nhttps://ko-fi.com/fabvittori\n''')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/pawbook/sensor.py custom_components/pawbook/manifest.json RELEASE-6.6.0.md
          git commit -m "PawBook 6.6.0 Recorder optimization"
          git push
