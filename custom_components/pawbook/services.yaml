add_weight:
  name: Aggiungi peso
  description: Registra una pesata nel libretto sanitario.
  fields:
    dog_id:
      name: Cane
      description: Nome, microchip oppure ID della configurazione.
      required: true
      selector:
        text:
    weight:
      name: Peso
      required: true
      selector:
        number:
          min: 0.1
          max: 150
          step: 0.1
          unit_of_measurement: kg
    date:
      name: Data
      selector:
        date:
    notes:
      name: Note
      selector:
        text:
          multiline: true

