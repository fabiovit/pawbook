delete_record:
  name: Elimina registrazione
  fields:
    dog_id:
      name: Cane
      required: true
      selector:
        text:
    category:
      name: Categoria
      required: true
      selector:
        select:
          options:
            - weights
            - vaccinations
            - visits
            - treatments
            - heat_cycles
    record_id:
      name: ID registrazione
      required: true
      selector:
        text:
